{{- if .Site.Params.header.showTitle | default true }}
  <a
    class="flex items-center gap-2 decoration-primary-500 hover:underline hover:decoration-2 hover:underline-offset-2"
    style="display:flex;align-items:center;gap:0.4rem;"
    rel="me"
    href="{{ "" | relLangURL }}"
    >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <!-- notebook cover -->
      <rect x="4" y="2" width="14" height="20" rx="1.5"/>
      <!-- spine binding -->
      <line x1="4" y1="2" x2="4" y2="22"/>
      <!-- binding rings -->
      <path d="M4 6 Q1.5 6, 1.5 7.5 Q1.5 9, 4 9"/>
      <path d="M4 13 Q1.5 13, 1.5 14.5 Q1.5 16, 4 16"/>
      <!-- ruled lines -->
      <line x1="8" y1="8" x2="15" y2="8"/>
      <line x1="8" y1="12" x2="15" y2="12"/>
      <line x1="8" y1="16" x2="13" y2="16"/>
    </svg>
    {{ .Site.Title | markdownify | emojify }}</a
  >
{{- end }}
