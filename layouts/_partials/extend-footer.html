<canvas id="particle-canvas"></canvas>
<script>
(function () {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');

  const PARTICLE_COUNT = 80;
  const CONNECTION_DISTANCE = 150;
  const PARTICLE_SPEED = 0.4;
  const PARTICLE_RADIUS = 2;

  let particles = [];
  let animFrame;

  function isDark() {
    return document.documentElement.classList.contains('dark') ||
      document.documentElement.getAttribute('data-default-appearance') === 'dark';
  }

  function getColors() {
    if (isDark()) {
      return { particle: 'rgba(99,179,237,0.7)', line: 'rgba(99,179,237,', bg: 'transparent' };
    }
    return { particle: 'rgba(49,130,206,0.5)', line: 'rgba(49,130,206,', bg: 'transparent' };
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function createParticle() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * PARTICLE_SPEED * 2,
      vy: (Math.random() - 0.5) * PARTICLE_SPEED * 2,
    };
  }

  function init() {
    resize();
    particles = Array.from({ length: PARTICLE_COUNT }, createParticle);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const colors = getColors();

    // Update positions
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    }

    // Draw connections
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECTION_DISTANCE) {
          const opacity = (1 - dist / CONNECTION_DISTANCE) * 0.5;
          ctx.beginPath();
          ctx.strokeStyle = colors.line + opacity + ')';
          ctx.lineWidth = 0.8;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }

    // Draw particles
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, PARTICLE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = colors.particle;
      ctx.fill();
    }

    animFrame = requestAnimationFrame(draw);
  }

  // Pause when tab is hidden to save CPU
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(animFrame);
    } else {
      draw();
    }
  });

  window.addEventListener('resize', () => {
    resize();
  });

  init();
  draw();
})();
</script>
