<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 418" width="800" height="418">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(167,139,250,0.15)"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="418" fill="#0f172a"/>
  <rect width="800" height="418" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#A78BFA" stroke-width="0.3" opacity="0.08">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="418"/>
    <line x1="160" y1="0" x2="160" y2="418"/>
    <line x1="240" y1="0" x2="240" y2="418"/>
    <line x1="320" y1="0" x2="320" y2="418"/>
    <line x1="400" y1="0" x2="400" y2="418"/>
    <line x1="480" y1="0" x2="480" y2="418"/>
    <line x1="560" y1="0" x2="560" y2="418"/>
    <line x1="640" y1="0" x2="640" y2="418"/>
    <line x1="720" y1="0" x2="720" y2="418"/>
    <line x1="800" y1="0" x2="800" y2="418"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="800" height="3" fill="#A78BFA" opacity="0.8"/>

  <!-- Icon: scale 64x64 paths to ~200px, centered at (400, 185) -->
  <g transform="translate(400,185) scale(3.1) translate(-32,-32)" filter="url(#glow)">
    <g stroke="#A78BFA" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16,16 A6,6 0 1,1 16,15.9 M48,16 A6,6 0 1,1 48,15.9 M16,48 A6,6 0 1,1 16,47.9 M48,48 A6,6 0 1,1 48,47.9 M32,32 A6,6 0 1,1 32,31.9 M16,22 L16,42 M48,22 L48,42 M22,16 L42,16 M22,48 L42,48 M20,28 L26,32 M38,32 L44,28 M20,36 L26,32 M38,32 L44,36"/>
    </g>
  </g>

  <!-- Title -->
  <text x="50%" y="80%" dominant-baseline="middle" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="white" opacity="0.9">Building a Domain-Specific MCP Toolserver</text>
    <text x="50%" y="88%" dominant-baseline="middle" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="white" opacity="0.9">for Claude</text>

  <!-- Bottom accent line -->
  <rect x="0" y="415" width="800" height="3" fill="#A78BFA" opacity="0.4"/>
</svg>