<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 418" width="800" height="418">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(74,222,128,0.15)"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="418" fill="#0f172a"/>
  <rect width="800" height="418" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#4ADE80" stroke-width="0.3" opacity="0.08">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="418"/>
    <line x1="160" y1="0" x2="160" y2="418"/>
    <line x1="240" y1="0" x2="240" y2="418"/>
    <line x1="320" y1="0" x2="320" y2="418"/>
    <line x1="400" y1="0" x2="400" y2="418"/>
    <line x1="480" y1="0" x2="480" y2="418"/>
    <line x1="560" y1="0" x2="560" y2="418"/>
    <line x1="640" y1="0" x2="640" y2="418"/>
    <line x1="720" y1="0" x2="720" y2="418"/>
    <line x1="800" y1="0" x2="800" y2="418"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="800" height="3" fill="#4ADE80" opacity="0.8"/>

  <!-- Icon: scale 64x64 paths to ~200px, centered at (400, 185) -->
  <g transform="translate(400,185) scale(3.1) translate(-32,-32)" filter="url(#glow)">
    <g stroke="#4ADE80" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16,10 L10,10 Q6,10 6,14 L6,22 Q6,26 2,26 Q6,26 6,30 L6,38 Q6,42 10,42 L16,42 M48,10 L54,10 Q58,10 58,14 L58,22 Q58,26 62,26 Q58,26 58,30 L58,38 Q58,42 54,42 L48,42 M24,16 L40,16 L40,46 L24,46 Z M24,22 L40,22 M28,18 L28,14 M36,18 L36,14 M28,28 L32,28 M28,34 L36,34 M28,40 L34,40"/>
    </g>
  </g>

  <!-- Title -->
  <text x="50%" y="80%" dominant-baseline="middle" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="white" opacity="0.9">Custom Jackson Deserializers for Multiple</text>
    <text x="50%" y="88%" dominant-baseline="middle" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="white" opacity="0.9">Date Formats</text>

  <!-- Bottom accent line -->
  <rect x="0" y="415" width="800" height="3" fill="#4ADE80" opacity="0.4"/>
</svg>