<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 418" width="800" height="418">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(167,139,250,0.15)"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="418" fill="#0f172a"/>
  <rect width="800" height="418" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#A78BFA" stroke-width="0.3" opacity="0.08">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="418"/>
    <line x1="160" y1="0" x2="160" y2="418"/>
    <line x1="240" y1="0" x2="240" y2="418"/>
    <line x1="320" y1="0" x2="320" y2="418"/>
    <line x1="400" y1="0" x2="400" y2="418"/>
    <line x1="480" y1="0" x2="480" y2="418"/>
    <line x1="560" y1="0" x2="560" y2="418"/>
    <line x1="640" y1="0" x2="640" y2="418"/>
    <line x1="720" y1="0" x2="720" y2="418"/>
    <line x1="800" y1="0" x2="800" y2="418"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="800" height="3" fill="#A78BFA" opacity="0.8"/>

  <!-- Icon: scale 64x64 paths to ~200px, centered at (400, 185) -->
  <g transform="translate(400,185) scale(3.1) translate(-32,-32)" filter="url(#glow)">
    <g stroke="#A78BFA" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12,16 A4,4 0 1,1 12,15.9 M12,32 A4,4 0 1,1 12,31.9 M12,48 A4,4 0 1,1 12,47.9 M12,20 L12,28 M12,36 L12,44 M32,24 A4,4 0 1,1 32,23.9 M32,40 A4,4 0 1,1 32,39.9 M16,18 L28,24 M16,46 L28,40 M36,26 L52,26 M36,42 L52,42 M52,16 A4,4 0 1,1 52,15.9 M52,32 A4,4 0 1,1 52,31.9 M52,48 A4,4 0 1,1 52,47.9 M52,20 L52,28 M52,36 L52,44"/>
    </g>
  </g>

  <!-- Title -->
  <text x="50%" y="84%" dominant-baseline="middle" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="white" opacity="0.9">Useful Git Tips, Tricks and Workflow</text>

  <!-- Bottom accent line -->
  <rect x="0" y="415" width="800" height="3" fill="#A78BFA" opacity="0.4"/>
</svg>